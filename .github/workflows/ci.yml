# Lightweight checks — no Docker / no Synaptic-Core cold build.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-syntax:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: CI parity (syntax + unit tests + pin check)
        run: |
          chmod +x scripts/hooks/ci-check.sh scripts/wait-healthy.sh
          ./scripts/hooks/ci-check.sh
      - name: Compose config (pin stack)
        run: |
          export SYNAPTIC_CORE_REF="$(sed -n 's/^Synaptic-Core-ref=//p' PINNED_VERSIONS.txt)"
          export POSTGRES_IMAGE="$(sed -n 's/^postgres-image=//p' PINNED_VERSIONS.txt)"
          docker compose -f docker-compose.yml config >/dev/null
