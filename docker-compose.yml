# Local demo stack. Host ports are loopback-only. Postgres is not published.
# MinIO is not used (Core default storage is local). TES/WES need host Docker.
services:
  synaptic-core-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SYNAPTIC_CORE_REF: ${SYNAPTIC_CORE_REF:-ffbc955cb611bf9bb2ddf7dafe84ab96a0213a79}
    container_name: sc-demo-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SC_SERVER_BIND_ADDR: "0.0.0.0:8080"
      SC_PUBLIC_BASE_URL: "http://127.0.0.1:8080"
      SC_DATABASE_URL: "postgres://synaptic:synaptic@postgres:5432/synaptic_core"
      SC_STORAGE_BACKEND: "local"
      SC_STORAGE_PATH: "/opt/synaptic-core/.sc-data"
      RUST_LOG: "info"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - sc_demo_objects:/opt/synaptic-core/.sc-data
      # Host Docker for TES/WES. Required for COMPLETE; do not expose this stack past loopback.
      - /var/run/docker.sock:/var/run/docker.sock

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.9-alpine}
    container_name: sc-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: synaptic
      POSTGRES_PASSWORD: synaptic
      POSTGRES_DB: synaptic_core
    # Internal network only — not published on the host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synaptic -d synaptic_core"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - sc_demo_postgres:/var/lib/postgresql/data

volumes:
  sc_demo_postgres:
  sc_demo_objects:
